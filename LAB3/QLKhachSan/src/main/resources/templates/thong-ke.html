<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thống kê</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            padding: 20px;
        }

        .container {
            width: 1200px;
            max-width: 100%;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .filter {
            display: flex;
            align-items: end;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #3498db;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-thongke {
            background-color: #3498db;
            color: white;
        }

        .btn-dong {
            background-color: #777;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .section {
            margin-top: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        td.money {
            text-align: right;
        }

        .empty {
            color: #888;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>THỐNG KÊ</h2>

    <!-- ================= BỘ LỌC NGÀY ================= -->

    <div class="filter">

        <div class="form-group">
            <label for="dtTu">Từ ngày</label>

            <input
                type="date"
                id="dtTu">
        </div>


        <div class="form-group">
            <label for="dtDen">Đến ngày</label>

            <input
                type="date"
                id="dtDen">
        </div>


        <div class="button-group">

            <button
                class="btn-thongke"
                onclick="thongKe()">
                Thống kê
            </button>

            <button
                class="btn-dong"
                onclick="dongForm()">
                Đóng
            </button>

        </div>

    </div>


    <!-- ================= TỔNG HỢP ================= -->

    <div class="section">

        <div class="section-title">
            Tổng hợp
        </div>

        <table>

            <thead>

                <tr>
                    <th>Phiếu đặt</th>
                    <th>Đang ở</th>
                    <th>Hóa đơn</th>
                    <th>Doanh thu</th>
                    <th>Đền bù</th>
                </tr>

            </thead>

            <tbody id="dgvTongHop">

                <tr>
                    <td colspan="5" class="empty">
                        Chưa có dữ liệu thống kê
                    </td>
                </tr>

            </tbody>

        </table>

    </div>


    <!-- ================= DỊCH VỤ ================= -->

    <div class="section">

        <div class="section-title">
            Thống kê dịch vụ
        </div>

        <table>

            <thead>

                <tr>
                    <th>STT</th>
                    <th>Mã dịch vụ</th>
                    <th>Tên dịch vụ</th>
                    <th>Số lượng</th>
                    <th>Tổng tiền</th>
                </tr>

            </thead>

            <tbody id="dgvDV">

                <tr>
                    <td colspan="5" class="empty">
                        Chưa có dữ liệu thống kê
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

    const API = "/api/thong-ke";


    // ==========================================
    // KHI MỞ FORM
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];

            document
                .getElementById("dtTu")
                .value = today;

            document
                .getElementById("dtDen")
                .value = today;

        }
    );


    // ==========================================
    // THỐNG KÊ
    // ==========================================

    async function thongKe() {

        const tu =
            document
                .getElementById("dtTu")
                .value;

        const den =
            document
                .getElementById("dtDen")
                .value;


        // Kiểm tra ngày

        if (!tu || !den) {

            alert("Vui lòng chọn đầy đủ ngày.");

            return;
        }


        if (den < tu) {

            alert(
                "Đến ngày không được trước từ ngày."
            );

            return;
        }


        try {

            await Promise.all([
                loadTongHop(tu, den),
                loadDichVu(tu, den)
            ]);

        } catch (error) {

            console.error(error);

            alert(
                "Không thể thực hiện thống kê."
            );

        }

    }


    // ==========================================
    // TỔNG HỢP
    // ==========================================

    async function loadTongHop(tu, den) {

        const response =
            await fetch(
                API +
                "/tong-hop?tu=" +
                encodeURIComponent(tu) +
                "&den=" +
                encodeURIComponent(den)
            );


        if (!response.ok) {

            throw new Error(
                "Lỗi tải thống kê tổng hợp"
            );

        }


        const data =
            await response.json();


        const tbody =
            document.getElementById(
                "dgvTongHop"
            );

        tbody.innerHTML = "";


        /*
         * API có thể trả về:
         *
         * {
         *   soPhieuDat: 10,
         *   dangO: 2,
         *   soHoaDon: 8,
         *   doanhThuHoaDon: 5000000,
         *   tongDenBu: 300000
         * }
         */


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${data.soPhieuDat ?? 0}
            </td>

            <td>
                ${data.dangO ?? 0}
            </td>

            <td>
                ${data.soHoaDon ?? 0}
            </td>

            <td class="money">
                ${formatTien(
                    data.doanhThuHoaDon
                )}
            </td>

            <td class="money">
                ${formatTien(
                    data.tongDenBu
                )}
            </td>

        `;


        tbody.appendChild(row);

    }


    // ==========================================
    // DỊCH VỤ
    // ==========================================

    async function loadDichVu(tu, den) {

        const response =
            await fetch(
                API +
                "/dich-vu?tu=" +
                encodeURIComponent(tu) +
                "&den=" +
                encodeURIComponent(den)
            );


        if (!response.ok) {

            throw new Error(
                "Lỗi tải thống kê dịch vụ"
            );

        }


        const data =
            await response.json();


        const tbody =
            document.getElementById(
                "dgvDV"
            );

        tbody.innerHTML = "";


        if (!data || data.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty">
                        Không có dữ liệu dịch vụ
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(
            (item, index) => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${item.maDV ?? ""}
                    </td>

                    <td>
                        ${item.tenDV ?? ""}
                    </td>

                    <td>
                        ${item.tongSoLuong ?? 0}
                    </td>

                    <td class="money">
                        ${formatTien(
                            item.tongTien
                        )}
                    </td>

                `;


                tbody.appendChild(row);

            }
        );

    }


    // ==========================================
    // FORMAT TIỀN
    // ==========================================

    function formatTien(value) {

        const soTien =
            Number(value || 0);

        return soTien.toLocaleString(
            "vi-VN"
        ) + " VNĐ";

    }


    // ==========================================
    // ĐÓNG FORM
    // ==========================================

    function dongForm() {

        window.history.back();

    }

</script>

</body>
</html>
