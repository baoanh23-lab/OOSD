
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>e-SHOPPING - Sản phẩm</title>

    <link rel="stylesheet"
          href="/css/style.css">

    <style>

        /* =========================
           DANH SÁCH SẢN PHẨM
        ========================= */

        .product-container {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 25px;

            margin-top: 25px;
        }


        /* =========================
           CARD SẢN PHẨM
        ========================= */

        .product-card {
            background: white;

            border-radius: 10px;

            overflow: hidden;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }


        /* =========================
           HÌNH ẢNH
        ========================= */

        .product-image {
            width: 100%;

            height: 230px;

            background-color: #f5f5f5;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .product-image img {
            width: 100%;

            height: 100%;

            object-fit: contain;

            padding: 15px;
        }


        /* =========================
           THÔNG TIN
        ========================= */

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            margin-top: 0;

            margin-bottom: 15px;
        }

        .product-info p {
            margin: 8px 0;
        }

        .price {
            color: #d62828;

            font-size: 20px;

            font-weight: bold;
        }


        /* =========================
           BUTTON
        ========================= */

        .button-group {
            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .button-group a,
        .button-group button {
            flex: 1;

            padding: 10px;

            border: none;

            border-radius: 5px;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

            font-size: 14px;
        }

        .btn-detail {
            background-color: #eee;

            color: #333;
        }

        .btn-cart {
            background-color: #222;

            color: white;
        }

        .btn-detail:hover {
            background-color: #ddd;
        }

        .btn-cart:hover {
            background-color: #555;
        }


        /* =========================
           NHÓM SẢN PHẨM
        ========================= */

        .category-list {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 25px;
        }

        .category-list a {
            padding: 10px 18px;

            background-color: white;

            border: 1px solid #ddd;

            border-radius: 5px;

            color: #333;

            text-decoration: none;
        }

        .category-list a:hover {
            background-color: #222;

            color: white;
        }


        /* =========================
           GIỎ HÀNG
        ========================= */

        .cart-link {
            display: inline-block;

            margin-bottom: 20px;

            padding: 10px 18px;

            background-color: #222;

            color: white;

            text-decoration: none;

            border-radius: 5px;
        }

        .cart-link:hover {
            background-color: #555;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .product-container {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>e-SHOPPING</h1>

    <nav>

        <a href="/san-pham">
            Sản phẩm
        </a>

        <a href="/gio-hang">
            Giỏ hàng
        </a>

    </nav>

</header>



<!-- =========================
     NỘI DUNG
========================= -->

<main>

    <h2>
        Danh sách sản phẩm
    </h2>


    <!-- =========================
         NHÓM SẢN PHẨM
    ========================= -->

    <div class="category-list">

        <a href="/san-pham">
            Tất cả
        </a>

        <a th:each="nhom : ${danhSachNhom}"
           th:href="@{/san-pham/nhom/{id}(id=${nhom.maNhom})}"
           th:text="${nhom.tenNhom}">

            Nhóm sản phẩm

        </a>

    </div>



    <!-- =========================
         LINK GIỎ HÀNG
    ========================= -->

    <a href="/gio-hang"
       class="cart-link">

        🛒 Xem giỏ hàng

    </a>



    <!-- =========================
         DANH SÁCH SẢN PHẨM
    ========================= -->

    <div class="product-container">


        <div class="product-card"
             th:each="sp, stat : ${danhSachSanPham}">


            <!-- =========================
                 HÌNH ẢNH
            ========================= -->

            <div class="product-image">


                <!-- Sản phẩm 1 -->

                <img th:if="${stat.index == 0}"
                     src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
                     alt="Laptop">


                <!-- Sản phẩm 2 -->

                <img th:if="${stat.index == 1}"
                     src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"
                     alt="Điện thoại">


                <!-- Sản phẩm 3 -->

                <img th:if="${stat.index == 2}"
                     src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef"
                     alt="Laptop">


                <!-- Các sản phẩm còn lại -->

                <img th:if="${stat.index > 2}"
                     src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
                     alt="Sản phẩm">

            </div>



            <!-- =========================
                 THÔNG TIN SẢN PHẨM
            ========================= -->

            <div class="product-info">


                <h3 th:text="${sp.tenSanPham}">
                    Tên sản phẩm
                </h3>


                <p>

                    <strong>
                        Mã sản phẩm:
                    </strong>

                    <span th:text="${sp.maSanPham}">
                        1
                    </span>

                </p>


                <p>

                    <strong>
                        Nhà sản xuất:
                    </strong>

                    <span th:text="${sp.nhaSanXuat}">
                        Nhà sản xuất
                    </span>

                </p>


                <p>

                    <strong>
                        Giá:
                    </strong>

                    <span class="price"
                          th:text="${#numbers.formatDecimal(
                              sp.giaBanHienHanh,
                              0,
                              'COMMA',
                              0,
                              'POINT')}">

                        0

                    </span>

                    VNĐ

                </p>


                <p>

                    <strong>
                        Tình trạng:
                    </strong>

                    <span th:text="${sp.tinhTrang}">
                        Còn hàng
                    </span>

                </p>



                <!-- =========================
                     BUTTON
                ========================= -->

                <div class="button-group">


                    <!-- Xem chi tiết -->

                    <a href="#"
                       class="btn-detail">

                        Xem chi tiết

                    </a>


                    <!-- THÊM VÀO GIỎ -->

                    <a th:href="@{/san-pham/them-vao-gio/{id}(id=${sp.maSanPham})}"
                       class="btn-cart">

                        Thêm vào giỏ

                    </a>

                </div>


            </div>

        </div>

    </div>

</main>


</body>

</html>
