<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>e-SHOPPING - Giỏ hàng</title>

    <link rel="stylesheet"
          href="/css/style.css">
</head>

<body>

<header>

    <h1>e-SHOPPING</h1>

    <nav>
        <a href="/san-pham">Sản phẩm</a>
        <a href="/gio-hang">Giỏ hàng</a>
    </nav>

</header>


<main>

    <h2>Giỏ hàng của tôi</h2>

    <div th:if="${gioHang == null}">

        <p>Giỏ hàng hiện đang trống.</p>

    </div>


    <div th:if="${gioHang != null}">

        <table>

            <thead>
            <tr>
                <th>Mã sản phẩm</th>
                <th>Số lượng</th>
                <th>Đơn giá</th>
                <th>Thành tiền</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="ct : ${chiTiet}">

                <td th:text="${ct.maSanPham}">
                    1
                </td>

                <td th:text="${ct.soLuong}">
                    1
                </td>

                <td>
                    <span th:text="${#numbers.formatDecimal(
                        ct.donGia, 0, 'COMMA', 0, 'POINT')}">
                        0
                    </span>
                    VNĐ
                </td>

                <td>
                    <span th:text="${#numbers.formatDecimal(
                        ct.donGia * ct.soLuong,
                        0, 'COMMA', 0, 'POINT')}">
                        0
                    </span>
                    VNĐ
                </td>

            </tr>

            </tbody>

        </table>


        <div class="cart-total">

            <h3>
                Tổng tiền:

                <span th:text="${#numbers.formatDecimal(
                    gioHang.tongTien,
                    0, 'COMMA', 0, 'POINT')}">
                    0
                </span>

                VNĐ
            </h3>

            <button>Cập nhật giỏ hàng</button>

            <button>Đặt hàng</button>

        </div>

    </div>

</main>

</body>
</html>
