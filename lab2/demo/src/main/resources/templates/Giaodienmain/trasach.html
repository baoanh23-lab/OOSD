<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mượn - Trả sách</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 1210px;
            width: 100%;
            min-height: 765px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* TAB */
        .tabs {
            display: flex;
            border-bottom: 2px solid #198754;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 12px 25px;
            border: none;
            background-color: #e9ecef;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-right: 5px;
            border-radius: 6px 6px 0 0;
        }

        .tab-button.active {
            background-color: #198754;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* FORM */
        .form-section {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            height: 38px;
            padding: 8px 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f8f9fa;
            font-weight: bold;
        }

        /* BUTTON */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background-color: #198754;
            color: white;
        }

        .btn-info {
            background-color: #0dcaf0;
            color: black;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        /* SÁCH */
        .book-area {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: center;
        }

        .book-box {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            overflow: hidden;
        }

        .book-box h3 {
            margin-bottom: 10px;
        }

        .middle-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .middle-buttons button {
            width: 80px;
        }

        /* TABLE */
        .table-section {
            margin-top: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: #e9ecef;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }

        /* TRẢ SÁCH */
        .return-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 25px;
        }

        .fee-group {
            display: flex;
            flex-direction: column;
        }

        .fee-group label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .fee-group input,
        .fee-group select {
            height: 38px;
            padding: 8px 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
        }

        .bottom-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Mượn - Trả sách</h1>

    <!-- TAB -->
    <div class="tabs">
        <button class="tab-button active" onclick="openTab('tabMuon', this)">
            Mượn sách
        </button>
        <button class="tab-button" onclick="openTab('tabTra', this)">
            Trả sách
        </button>
    </div>

    <!-- ==================== TAB MƯỢN ==================== -->
    <div id="tabMuon" class="tab-content active">
        <div class="form-section">
            <div class="form-grid">
                <div class="form-group">
                    <label for="cboDocGia">Độc giả</label>
                    <select id="cboDocGia">
                        <option value="">-- Chọn độc giả --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>&nbsp;</label>
                    <button class="btn-info" id="btnKiemTra">
                        Kiểm tra điều kiện
                    </button>
                </div>

                <div class="form-group">
                    <label for="cboNhanVienMuon">Nhân viên lập phiếu</label>
                    <select id="cboNhanVienMuon">
                        <option value="">-- Chọn nhân viên --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dtNgayMuon">Ngày mượn</label>
                    <input type="date" id="dtNgayMuon">
                </div>

                <div class="form-group">
                    <label for="dtHenTra">Ngày hẹn trả</label>
                    <input type="date" id="dtHenTra">
                </div>
            </div>

            <!-- TRẠNG THÁI -->
            <div class="status" id="lblTrangThai">
                Chưa kiểm tra điều kiện mượn.
            </div>
        </div>

        <!-- SÁCH -->
        <div class="book-area">
            <!-- SÁCH CÒN -->
            <div class="book-box">
                <h3>Sách còn trong kho</h3>
                <div class="table-wrapper">
                    <table id="dgvSachCon">
                        <thead>
                            <tr>
                                <th>Mã đầu sách</th>
                                <th>Tên sách</th>
                                <th>Số lượng hiện có</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- SQL sẽ đưa dữ liệu vào đây -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- NÚT THÊM / BỎ -->
            <div class="middle-buttons">
                <button class="btn-primary" id="btnThemSach">Thêm >></button>
                <button class="btn-secondary" id="btnBoSach"><< Bỏ</button>
            </div>

            <!-- SÁCH ĐÃ CHỌN -->
            <div class="book-box">
                <h3>Sách được chọn</h3>
                <div class="table-wrapper">
                    <table id="dgvSachChon">
                        <thead>
                            <tr>
                                <th>Mã đầu sách</th>
                                <th>Tên sách</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Danh sách tạm -->
                        </tbody>
                    </table>
                </div>
                <p style="margin-top:10px;">
                    Tối đa 3 đầu sách khác nhau.
                </p>
            </div>
        </div>

        <!-- LẬP PHIẾU -->
        <div class="button-group">
            <button class="btn-primary" id="btnLapPhieu">
                Lập phiếu mượn
            </button>
        </div>
    </div>

    <!-- ==================== TAB TRẢ ==================== -->
    <div id="tabTra" class="tab-content">
        <div class="form-section">
            <div class="return-form">
                <div class="fee-group">
                    <label for="cboDocGiaTra">Độc giả trả sách</label>
                    <select id="cboDocGiaTra">
                        <option value="">-- Chọn độc giả --</option>
                    </select>
                </div>

                <div class="fee-group">
                    <label>&nbsp;</label>
                    <button class="btn-info" id="btnTaiSachMuon">
                        Tải sách đang mượn
                    </button>
                </div>

                <div class="fee-group">
                    <label for="cboNhanVienTra">Nhân viên nhận trả</label>
                    <select id="cboNhanVienTra">
                        <option value="">-- Chọn nhân viên --</option>
                    </select>
                </div>

                <div class="fee-group">
                    <label for="dtNgayTra">Ngày trả</label>
                    <input type="date" id="dtNgayTra">
                </div>

                <div class="fee-group">
                    <label for="cboTinhTrang">Tình trạng sách</label>
                    <select id="cboTinhTrang">
                        <option value="Bình thường">Bình thường</option>
                        <option value="Rách/Hư hỏng">Rách/Hư hỏng</option>
                        <option value="Mất">Mất</option>
                    </select>
                </div>

                <div class="fee-group">
                    <label for="numPhiPhat">Phí phạt</label>
                    <input type="number" id="numPhiPhat" min="0" max="1000000000" value="0">
                </div>
            </div>
        </div>

        <!-- SÁCH ĐANG MƯỢN -->
        <div class="table-section">
            <h3>Sách đang mượn</h3>
            <div class="table-wrapper">
                <table id="dgvDangMuon">
                    <thead>
                        <tr>
                            <th>Mã chi tiết</th>
                            <th>Mã phiếu mượn</th>
                            <th>Mã độc giả</th>
                            <th>Mã đầu sách</th>
                            <th>Tên sách</th>
                            <th>Ngày mượn</th>
                            <th>Ngày hẹn trả</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- SQL sẽ đưa dữ liệu vào đây -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- XÁC NHẬN TRẢ -->
        <div class="button-group">
            <button class="btn-primary" id="btnTraSach">
                Xác nhận trả sách
            </button>
        </div>
    </div>

    <!-- ĐÓNG -->
    <div class="bottom-buttons">
        <button class="btn-danger" id="btnDong" onclick="dongForm()">
            Đóng
        </button>
    </div>

</div>

<script>
    // Chuyển tab
    function openTab(tabId, button) {
        const tabs = document.querySelectorAll(".tab-content");
        tabs.forEach(function(tab) {
            tab.classList.remove("active");
        });

        const buttons = document.querySelectorAll(".tab-button");
        buttons.forEach(function(btn) {
            btn.classList.remove("active");
        });

        document.getElementById(tabId).classList.add("active");
        button.classList.add("active");
    }

    // Đóng form
    function dongForm() {
        window.location.href = "/";
    }

    // Ngày mặc định
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("dtNgayMuon").value = today;
    document.getElementById("dtNgayTra").value = today;

    // Ngày hẹn trả = hôm nay + 7 ngày
    const henTra = new Date();
    henTra.setDate(henTra.getDate() + 7);
    document.getElementById("dtHenTra").value = henTra.toISOString().split("T")[0];
</script>

</body>
</html>
