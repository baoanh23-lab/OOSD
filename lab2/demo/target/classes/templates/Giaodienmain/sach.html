<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý đầu sách</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f5f6f8;
            color: #333;
        }

        .container {
            width: 1100px;
            max-width: 95%;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Tìm kiếm */

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .search-box button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #1976d2;
            color: white;
            font-size: 15px;
        }

        .search-box button:hover {
            background-color: #125ca5;
        }

        /* Form */

        .book-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 25px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1976d2;
        }

        /* Button */

        .button-group {
            grid-column: 1 / 3;
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .button-group button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .btn-them {
            background-color: #28a745;
        }

        .btn-capnhat {
            background-color: #1976d2;
        }

        .btn-xoa {
            background-color: #dc3545;
        }

        .btn-lammoi {
            background-color: #6c757d;
        }

        .button-group button:hover {
            opacity: 0.85;
        }

        /* Thông báo */

        .message {
            padding: 12px;
            margin-bottom: 20px;
            background-color: #e8f4fd;
            border-left: 4px solid #1976d2;
            border-radius: 4px;
        }

        /* Bảng */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        thead {
            background-color: #343a40;
            color: white;
        }

        th,
        td {
            padding: 12px 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tbody tr:hover {
            background-color: #f1f1f1;
        }

        /* Nút xóa */

        .delete-link {
            display: inline-block;
            padding: 6px 12px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-link:hover {
            background-color: #b52a37;
        }

        /* Quay lại */

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1976d2;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Điện thoại */

        @media (max-width: 700px) {

            .book-form {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-column: 1;
                flex-wrap: wrap;
            }

            .search-box {
                flex-direction: column;
            }

            .container {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>QUẢN LÝ ĐẦU SÁCH</h1>


    <!-- TÌM KIẾM -->

    <form action="/sach" method="get" class="search-box">

        <input
                type="text"
                name="tuKhoa"
                placeholder="Nhập mã hoặc tên sách..."
                th:value="${tuKhoa}">

        <button type="submit">
            Tìm
        </button>

    </form>


    <!-- FORM SÁCH -->

    <form action="/sach/them" method="post" class="book-form">

        <div class="form-group">

            <label>Mã đầu sách</label>

            <input
                    type="text"
                    name="maDauSach"
                    required>

        </div>


        <div class="form-group">

            <label>Tên sách</label>

            <input
                    type="text"
                    name="tenSach"
                    required>

        </div>


        <div class="form-group">

            <label>Năm xuất bản</label>

            <input
                    type="number"
                    name="namXuatBan"
                    min="1000"
                    max="3000"
                    required>

        </div>


        <div class="form-group">

            <label>Số lượng hiện có</label>

            <input
                    type="number"
                    name="soLuongHienCo"
                    min="0"
                    required>

        </div>


        <div class="form-group">

            <label>Thể loại</label>

            <select name="maTheLoai" required>

                <option value="">
                    -- Chọn thể loại --
                </option>

                <option value="TL01">
                    Giáo dục
                </option>

                <option value="TL02">
                    Công nghệ
                </option>

                <option value="TL03">
                    Văn học
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Nhà xuất bản</label>

            <select name="maNhaXuatBan" required>

                <option value="">
                    -- Chọn nhà xuất bản --
                </option>

                <option value="NXB01">
                    NXB Giáo dục
                </option>

                <option value="NXB02">
                    NXB Trẻ
                </option>

                <option value="NXB03">
                    NXB Kim Đồng
                </option>

            </select>

        </div>


        <!-- BUTTON -->

        <div class="button-group">

            <button type="submit" class="btn-them">
                Thêm
            </button>

            <button type="button" class="btn-capnhat">
                Cập nhật
            </button>

            <button type="button" class="btn-xoa">
                Xóa
            </button>

            <button type="reset" class="btn-lammoi">
                Làm mới
            </button>

        </div>

    </form>


    <!-- THÔNG BÁO -->

    <div
            class="message"
            th:if="${thongBao}">

        <span th:text="${thongBao}"></span>

    </div>


    <!-- DANH SÁCH SÁCH -->

    <div class="table-wrapper">

        <table>

            <thead>

            <tr>

                <th>Mã đầu sách</th>
                <th>Tên sách</th>
                <th>Năm xuất bản</th>
                <th>Số lượng</th>
                <th>Thể loại</th>
                <th>Nhà xuất bản</th>
                <th>Thao tác</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="sach : ${danhSachSach}">

                <td th:text="${sach.maDauSach}"></td>

                <td th:text="${sach.tenSach}"></td>

                <td th:text="${sach.namXuatBan}"></td>

                <td th:text="${sach.soLuongHienCo}"></td>

                <td th:text="${sach.maTheLoai}"></td>

                <td th:text="${sach.maNhaXuatBan}"></td>

                <td>

                    <a
                            class="delete-link"
                            th:href="@{'/sach/xoa/' + ${sach.maDauSach}}"
                            onclick="return confirm('Bạn có chắc muốn xóa sách này?')">

                        Xóa

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- QUAY LẠI -->

    <a href="/" class="back-link">
        ← Quay lại trang chủ
    </a>

</div>

</body>

</html>
