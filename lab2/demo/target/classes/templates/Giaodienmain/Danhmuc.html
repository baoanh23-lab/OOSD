<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danh mục và nhân viên</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 1060px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* TAB */
        .tabs {
            display: flex;
            border-bottom: 2px solid #1976d2;
            margin-bottom: 25px;
        }

        .tab-button {
            padding: 12px 25px;
            border: none;
            background-color: #ddd;
            cursor: pointer;
            font-size: 16px;
        }

        .tab-button.active {
            background-color: #1976d2;
            color: white;
        }

        /* FORM */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: inline-block;
            width: 130px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 300px;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* BUTTON */
        .buttons {
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .buttons button {
            padding: 10px 20px;
            margin-right: 8px;
            border: none;
            border-radius: 5px;
            background-color: #1976d2;
            color: white;
            cursor: pointer;
        }

        .buttons button:hover {
            background-color: #125ca8;
        }

        .buttons .delete {
            background-color: #d32f2f;
        }

        .buttons .delete:hover {
            background-color: #a92323;
        }

        .buttons .close {
            background-color: #666;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #1976d2;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        /* Ẩn tab */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>DANH MỤC VÀ NHÂN VIÊN</h1>

    <!-- TAB -->
    <div class="tabs">

        <button class="tab-button active"
                onclick="openTab('tabNV', this)">
            Nhân viên
        </button>

        <button class="tab-button"
                onclick="openTab('tabTL', this)">
            Thể loại
        </button>

        <button class="tab-button"
                onclick="openTab('tabNXB', this)">
            Nhà xuất bản
        </button>

    </div>


    <!-- ================= NHÂN VIÊN ================= -->

    <div id="tabNV" class="tab-content active">

        <div class="form-group">
            <label>Mã nhân viên:</label>
            <input type="text" id="txtNVMa">
        </div>

        <div class="form-group">
            <label>Họ:</label>
            <input type="text" id="txtNVHo">
        </div>

        <div class="form-group">
            <label>Tên:</label>
            <input type="text" id="txtNVTen">
        </div>

        <div class="form-group">
            <label>Phái:</label>

            <select id="cboNVPhai">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
                <option value="Khác">Khác</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ngày sinh:</label>
            <input type="date" id="dtNVNgaySinh">
        </div>

        <div class="form-group">
            <label>Chức vụ:</label>
            <input type="text" id="txtNVChucVu">
        </div>

        <div class="form-group">
            <label>Điện thoại:</label>
            <input type="text" id="txtNVSDT">
        </div>

        <div class="buttons">

            <button>Thêm</button>

            <button>Cập nhật</button>

            <button class="delete">Xóa</button>

            <button>Làm mới</button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>Mã nhân viên</th>
                    <th>Họ</th>
                    <th>Tên</th>
                    <th>Phái</th>
                    <th>Ngày sinh</th>
                    <th>Chức vụ</th>
                    <th>Điện thoại</th>
                </tr>
            </thead>

            <tbody>
                <!-- Dữ liệu sẽ lấy từ SQL Server sau -->
            </tbody>

        </table>

    </div>


    <!-- ================= THỂ LOẠI ================= -->

    <div id="tabTL" class="tab-content">

        <div class="form-group">
            <label>Mã thể loại:</label>
            <input type="text" id="txtTLMa">
        </div>

        <div class="form-group">
            <label>Tên thể loại:</label>
            <input type="text" id="txtTLTen">
        </div>

        <div class="buttons">

            <button>Thêm</button>

            <button>Cập nhật</button>

            <button class="delete">Xóa</button>

            <button>Làm mới</button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>Mã thể loại</th>
                    <th>Tên thể loại</th>
                </tr>
            </thead>

            <tbody>
                <!-- Dữ liệu SQL Server -->
            </tbody>

        </table>

    </div>


    <!-- ================= NHÀ XUẤT BẢN ================= -->

    <div id="tabNXB" class="tab-content">

        <div class="form-group">
            <label>Mã nhà xuất bản:</label>
            <input type="text" id="txtNXBMa">
        </div>

        <div class="form-group">
            <label>Địa chỉ:</label>
            <input type="text" id="txtNXBDiaChi">
        </div>

        <div class="form-group">
            <label>Điện thoại:</label>
            <input type="text" id="txtNXBSDT">
        </div>

        <div class="buttons">

            <button>Thêm</button>

            <button>Cập nhật</button>

            <button class="delete">Xóa</button>

            <button>Làm mới</button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>Mã nhà xuất bản</th>
                    <th>Địa chỉ</th>
                    <th>Điện thoại</th>
                </tr>
            </thead>

            <tbody>
                <!-- Dữ liệu SQL Server -->
            </tbody>

        </table>

    </div>


    <div class="buttons">
        <button class="close" onclick="window.location.href='/'">
            Đóng
        </button>
    </div>

</div>


<script>

    function openTab(tabId, button) {

        // Ẩn tất cả nội dung
        let contents = document.querySelectorAll(".tab-content");

        contents.forEach(function(content) {
            content.classList.remove("active");
        });

        // Bỏ active của tất cả nút
        let buttons = document.querySelectorAll(".tab-button");

        buttons.forEach(function(btn) {
            btn.classList.remove("active");
        });

        // Hiện tab được chọn
        document.getElementById(tabId).classList.add("active");

        // Active nút hiện tại
        button.classList.add("active");
    }

</script>

</body>
</html>
