<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Độc giả và thẻ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 1190px;
            min-height: 790px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-section {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            height: 38px;
            padding: 8px 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #198754;
            color: white;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
        }

        .btn-info {
            background-color: #0dcaf0;
            color: black;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .table-section {
            margin-top: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: #e9ecef;
        }

        tr:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }

        .bottom-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Độc giả và thẻ</h1>

    <!-- Thông tin độc giả -->
    <div class="form-section">

        <div class="form-grid">

            <div class="form-group">
                <label for="txtMa">Mã độc giả</label>
                <input type="text" id="txtMa">
            </div>

            <div class="form-group">
                <label for="txtHo">Họ</label>
                <input type="text" id="txtHo">
            </div>

            <div class="form-group">
                <label for="txtTen">Tên</label>
                <input type="text" id="txtTen">
            </div>

            <div class="form-group">
                <label for="dtNgaySinh">Ngày sinh</label>
                <input type="date" id="dtNgaySinh">
            </div>

            <div class="form-group">
                <label for="cboPhai">Phái</label>
                <select id="cboPhai">
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>

            <div class="form-group">
                <label for="txtSDT">Số điện thoại</label>
                <input type="text" id="txtSDT">
            </div>

            <div class="form-group">
                <label for="txtDiaChi">Địa chỉ</label>
                <input type="text" id="txtDiaChi">
            </div>

            <div class="form-group">
                <label for="txtEmail">Email</label>
                <input type="email" id="txtEmail">
            </div>

            <div class="form-group">
                <label for="txtAnh">Đường dẫn ảnh 3x4</label>
                <input type="text" id="txtAnh">
            </div>

            <div class="form-group">
                <label for="dtNgayCap">Ngày cấp thẻ</label>
                <input type="date" id="dtNgayCap">
            </div>

            <div class="form-group">
                <label for="dtHan">Hạn sử dụng</label>
                <input type="date" id="dtHan">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="chkLePhi">
                <label for="chkLePhi">Đã đóng lệ phí năm</label>
            </div>

        </div>

        <!-- Các nút -->
        <div class="button-group">

            <button class="btn-primary" id="btnThem">
                Thêm độc giả
            </button>

            <button class="btn-warning" id="btnCapNhat">
                Cập nhật độc giả
            </button>

            <button class="btn-info" id="btnCapThe">
                Cấp thẻ
            </button>

            <button class="btn-primary" id="btnGiaHan">
                Gia hạn
            </button>

            <button class="btn-secondary" id="btnLamMoi">
                Làm mới
            </button>

        </div>

    </div>

    <!-- Danh sách độc giả -->
    <div class="table-section">

        <h3>Danh sách độc giả + thẻ gần nhất</h3>

        <div class="table-wrapper">

            <table id="dgvDocGia">

                <thead>
                    <tr>
                        <th>Mã độc giả</th>
                        <th>Họ</th>
                        <th>Tên</th>
                        <th>Ngày sinh</th>
                        <th>Phái</th>
                        <th>Số điện thoại</th>
                        <th>Địa chỉ</th>
                        <th>Email</th>
                        <th>Ảnh 3x4</th>
                        <th>Mã thẻ</th>
                        <th>Ngày cấp</th>
                        <th>Hạn sử dụng</th>
                        <th>Đã đóng lệ phí</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- Dữ liệu SQL sẽ được đưa vào đây sau -->
                </tbody>

            </table>

        </div>

    </div>

    <!-- Nút đóng -->
    <div class="bottom-buttons">
        <button class="btn-danger" id="btnDong" onclick="dongForm()">
            Đóng
        </button>
    </div>

</div>

<script>

    // Làm mới form
    document.getElementById("btnLamMoi").addEventListener("click", function () {

        document.getElementById("txtMa").value = "";
        document.getElementById("txtHo").value = "";
        document.getElementById("txtTen").value = "";
        document.getElementById("txtSDT").value = "";
        document.getElementById("txtDiaChi").value = "";
        document.getElementById("txtEmail").value = "";
        document.getElementById("txtAnh").value = "";

        document.getElementById("cboPhai").value = "Nam";

        document.getElementById("dtNgaySinh").value = "";
        document.getElementById("dtNgayCap").value = "";
        document.getElementById("dtHan").value = "";

        document.getElementById("chkLePhi").checked = true;

        document.getElementById("txtMa").readOnly = false;

        document.getElementById("btnThem").disabled = false;
        document.getElementById("btnCapNhat").disabled = true;

        document.getElementById("txtMa").focus();
    });


    // Đóng form
    function dongForm() {
        window.location.href = "/";
    }


    // Tạm thời khóa cập nhật khi mới mở form
    document.getElementById("btnCapNhat").disabled = true;

</script>

</body>
</html>
