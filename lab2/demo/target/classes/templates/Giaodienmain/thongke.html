<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thống kê</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 1070px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .filter {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .filter label {
            font-weight: bold;
        }

        .filter input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 9px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-thongke {
            background-color: #007bff;
            color: white;
        }

        .btn-thongke:hover {
            background-color: #0056b3;
        }

        .thong-ke {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .box {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            background-color: #fafafa;
        }

        .box p {
            font-size: 16px;
            font-weight: bold;
        }

        .box span {
            display: block;
            margin-top: 10px;
            font-size: 24px;
        }

        .bang-phat {
            margin-top: 20px;
        }

        .bang-phat h2 {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th,
        table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        table th {
            background-color: #eee;
        }

        .bottom {
            margin-top: 25px;
            text-align: right;
        }

        .btn-dong {
            background-color: #6c757d;
            color: white;
        }

        .btn-dong:hover {
            background-color: #545b62;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Thống kê</h1>

    <!-- Khoảng thời gian -->
    <div class="filter">

        <label for="dtTu">Từ ngày:</label>
        <input type="date" id="dtTu">

        <label for="dtDen">Đến ngày:</label>
        <input type="date" id="dtDen">

        <button class="btn-thongke" onclick="thongKe()">
            Thống kê
        </button>

    </div>

    <!-- Thống kê tổng hợp -->
    <div class="thong-ke">

        <div class="box">
            <p>Lượt sách mượn</p>
            <span id="lblMuon">0</span>
        </div>

        <div class="box">
            <p>Sách quá hạn</p>
            <span id="lblQuaHan">0</span>
        </div>

        <div class="box">
            <p>Sách mất</p>
            <span id="lblMat">0</span>
        </div>

        <div class="box">
            <p>Sách hư hỏng</p>
            <span id="lblHuHong">0</span>
        </div>

    </div>

    <!-- Tổng phí phạt -->
    <div class="box" style="margin-bottom: 30px;">
        <p>Tổng phí phạt</p>
        <span id="lblPhiPhat">0 đ</span>
    </div>

    <!-- Chi tiết phiếu phạt -->
    <div class="bang-phat">

        <h2>Chi tiết phiếu phạt</h2>

        <table>
            <thead>
                <tr>
                    <th>Mã phiếu phạt</th>
                    <th>Ngày phạt</th>
                    <th>Mã độc giả</th>
                    <th>Mã đầu sách</th>
                    <th>Tên sách</th>
                    <th>Lý do</th>
                    <th>Phí phạt</th>
                    <th>Mã nhân viên</th>
                </tr>
            </thead>

            <tbody id="dgvPhat">
                <tr>
                    <td colspan="8">Chưa có dữ liệu</td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- Đóng -->
    <div class="bottom">
        <button class="btn-dong" onclick="dongForm()">
            Đóng
        </button>
    </div>

</div>

<script>

    // Lấy ngày hiện tại
    const homNay = new Date();

    // Ngày đầu tháng hiện tại
    const ngayDauThang = new Date(
        homNay.getFullYear(),
        homNay.getMonth(),
        1
    );

    function formatDate(date) {
        const nam = date.getFullYear();
        const thang = String(date.getMonth() + 1).padStart(2, '0');
        const ngay = String(date.getDate()).padStart(2, '0');

        return `${nam}-${thang}-${ngay}`;
    }

    // Giống FrmThongKe_Load
    document.getElementById("dtTu").value =
        formatDate(ngayDauThang);

    document.getElementById("dtDen").value =
        formatDate(homNay);


    function thongKe() {

        const tuNgay = document.getElementById("dtTu").value;
        const denNgay = document.getElementById("dtDen").value;

        if (!tuNgay || !denNgay) {
            alert("Vui lòng chọn đầy đủ từ ngày và đến ngày!");
            return;
        }

        // Nếu ngày đến nhỏ hơn ngày bắt đầu
        if (denNgay < tuNgay) {
            alert("Khoảng ngày không hợp lệ!");
            return;
        }

        /*
         * Phần này sẽ nối với ThongKeService
         * ở bước tiếp theo.
         */

        console.log("Từ ngày:", tuNgay);
        console.log("Đến ngày:", denNgay);
    }


    function dongForm() {
        window.location.href = "/";
    }

</script>

</body>
</html>
